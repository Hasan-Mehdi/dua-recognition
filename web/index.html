<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1320">
  <title>Du'a Companion</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -12 24 24'%3E%3Cg fill='%23d9b46a'%3E%3Crect x='-8' y='-8' width='16' height='16'/%3E%3Crect x='-8' y='-8' width='16' height='16' transform='rotate(45)'/%3E%3C/g%3E%3Ccircle r='4' fill='%230e1320'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <!-- The titles' Ruqaa waits for its font (display=block) instead of showing in a stand-in and swapping. -->
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=block" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="kids.css">
  <link rel="stylesheet" href="practice.css">
  <!-- Static hosts (GitHub Pages) can't send COOP/COEP headers; this vendored
       MIT shim (gzuidhof/coi-serviceworker) adds them, which lets ONNX Runtime
       Web use threads: ~2.4 s -> ~1 s per window on a desktop CPU. -->
  <script src="coi-serviceworker.js"></script>
</head>
<body data-state="idle">
  <!-- Reusable ornaments: an eight-pointed star (khatam) and a verse-end rosette. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="khatam" viewBox="-50 -50 100 100">
        <rect x="-32" y="-32" width="64" height="64" pathLength="1"/>
        <rect x="-32" y="-32" width="64" height="64" transform="rotate(45)" pathLength="1"/>
        <circle r="24" pathLength="1" style="fill: var(--core, none)"/>
      </symbol>
      <symbol id="rosette" viewBox="-50 -50 100 100">
        <path d="M0-46 7.2-36.3 17.6-42.5 20.6-30.8 32.5-32.5 30.8-20.6 42.5-17.6 36.3-7.2 46 0 36.3 7.2 42.5 17.6 30.8 20.6 32.5 32.5 20.6 30.8 17.6 42.5 7.2 36.3 0 46-7.2 36.3-17.6 42.5-20.6 30.8-32.5 32.5-30.8 20.6-42.5 17.6-36.3 7.2-46 0-36.3-7.2-42.5-17.6-30.8-20.6-32.5-32.5-20.6-30.8-17.6-42.5-7.2-36.3Z"/>
        <circle r="29"/>
      </symbol>
      <!-- An open book on a rehal: practise mode's mark on the seal. -->
      <symbol id="rehal" viewBox="0 0 24 24">
        <path d="M12 7.5C9.5 5.8 6.5 5.5 3.5 6.5V13c3-1 6-.7 8.5 1 2.5-1.7 5.5-2 8.5-1V6.5c-3-1-6-.7-8.5 1ZM12 7.5V14"/>
        <path d="M8.2 13.6 16.6 20.6M15.8 13.6 7.4 20.6"/>
      </symbol>
      <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
      <symbol id="lantern" viewBox="0 0 24 34"><circle cx="12" cy="3" r="2"/><path d="M5.5 10Q12 3.5 18.5 10Z"/><rect x="4" y="9.5" width="16" height="4" rx="2"/><rect x="6" y="13.5" width="12" height="12" rx="4"/><rect x="4" y="25" width="16" height="4" rx="2"/><path d="M9 29H15L12 32.5Z"/></symbol>
    </defs>
  </svg>

  <!-- The page border: a double rule with corner rosettes, like an illuminated folio. -->
  <div class="folio" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="top">
    <!-- While following: the start button's seal, still breathing with the voice (meter() in app.js). -->
    <span class="live" aria-hidden="true"><svg viewBox="-50 -50 100 100"><use href="#khatam" x="-50" y="-50" width="100" height="100"/></svg></span>
    <div class="title">
      <span id="dua-ar" class="title-ar" lang="ar"></span>
      <span id="dua-en" class="title-en"></span>
      <span id="dua-also" class="title-also"></span>
    </div>
    <div class="actions">
      <button id="menu-btn" class="icon" aria-label="Display options" title="Display options">Aa</button>
      <button id="stop" class="icon" aria-label="Stop" title="Stop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="progress"><i id="progress"></i></div>
  </header>

  <!-- Kids mode (kids.css) unwraps .home-bar, .home-main and .shelf (display: contents) and lays the home out its own way. -->
  <section id="home" class="home">
    <header class="home-bar">
      <div class="brand">
        <h1 class="brand-ar wordmark" lang="ar">رفيق الدعاء</h1>
        <p class="brand-en">Du'a Companion</p>
      </div>
      <div class="home-actions">
        <!-- Kids mode (kids.js, kids.css): the same app, dressed for children. -->
        <button id="kids-on" class="kids-on" aria-label="Kids mode" title="Kids mode">
          <svg viewBox="0 0 24 34" aria-hidden="true"><use href="#lantern"/></svg>Kids
        </button>
        <button id="home-menu" class="icon" aria-label="Display options" title="Display options">Aa</button>
      </div>
    </header>

    <div class="home-main">
      <button id="start" class="seal" aria-label="Start listening">
        <svg class="seal-star" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#khatam" x="-50" y="-50" width="100" height="100"/></svg>
        <!-- Practising: a book open on a rehal, the stand du'as are learnt from, in place of the mic (practice.css). -->
        <svg class="seal-rehal" viewBox="0 0 24 24" aria-hidden="true"><use href="#rehal"/></svg>
        <svg class="seal-mic" viewBox="0 0 24 24" aria-hidden="true"><use href="#mic"/></svg>
      </button>
      <p id="hint" class="hint"></p>
      <div id="load" class="load" hidden><i id="load-bar"></i></div>
      <!-- What the seal does (setPractising in app.js): follow along, or practise, where each line is checked
           (practice.js). A thumb slides under the chosen one. -->
      <div id="modes" class="modes" role="radiogroup" aria-label="Mode" hidden>
        <button id="mode-follow" role="radio" aria-checked="true"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#mic"/></svg>Follow</button>
        <button id="mode-practise" role="radio" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#rehal"/></svg>Practise</button>
      </div>
      <button id="home-hide" class="toggle" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
        Hide the text
      </button>
    </div>

    <!-- One tap into a du'a: where the last one stopped, what's recited now, the starred ones (showToday). -->
    <div class="shelf">
      <button id="resume" class="row resume" hidden></button>
      <div id="today" class="today" hidden>
        <span id="today-label" class="guess-label"></span>
        <div id="today-chips" class="chips"></div>
      </div>
    </div>

    <div class="find">
      <button id="choose" class="search-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <span>Search du'as and ziyarat</span>
      </button>
      <button id="play" class="icon square" aria-label="Play a recording" title="Play a recording">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>
      </button>
    </div>
    <input id="file" type="file" accept="audio/*" hidden>
    <ul id="samples" class="samples" hidden></ul>
    <!-- Debug sessions (session-log.js): what was heard and shown, for replaying offline. -->
    <p id="sessions" class="sessions" hidden>
      <span id="sessions-info"></span>
      <button id="sessions-send" class="link"></button><span class="dot">·</span><button id="sessions-clear" class="link">delete</button>
    </p>
  </section>

  <main id="stage" class="stage">
    <!-- Before the du'a is known: a star draws itself while the guesses firm up. -->
    <div id="listen" class="listen">
      <!-- The voice's loudness moves only transform and opacity (see meter() in app.js). -->
      <div class="voice" aria-hidden="true">
        <i class="voice-glow"></i>
        <svg class="girih" viewBox="-50 -50 100 100">
          <use href="#khatam" x="-50" y="-50" width="100" height="100"/>
          <circle r="44" pathLength="1"/><circle r="12" pathLength="1"/>
        </svg>
        <!-- The seal's mic, carried over from the button; it brightens as it hears the voice (meter()). -->
        <svg class="voice-mic" viewBox="0 0 24 24"><use href="#mic"/></svg>
      </div>
      <p id="listen-msg" class="listen-msg" aria-live="polite">Begin reciting</p>
      <div id="guesses" class="guesses" hidden>
        <span class="guess-label">Is it…</span>
        <div id="guess-chips" class="chips"></div>
      </div>
    </div>
    <!-- Once it is: the whole text, scrolling with the reciter like lyrics. -->
    <div id="folio-head" class="folio-head" hidden>
      <h2 id="head-ar" class="head-ar" lang="ar"></h2>
      <p id="head-en" class="head-en"></p>
      <p id="head-note" class="head-note"></p>
    </div>
    <div id="text" class="text"></div>
  </main>

  <div id="picker" class="picker" hidden>
    <div class="picker-card">
      <i class="grabber" aria-hidden="true"></i>
      <label class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="search" type="search" placeholder="Search du'as and ziyarat" autocomplete="off">
      </label>
      <ul id="picker-list"></ul>
    </div>
  </div>

  <!-- Display options (the Aa button, on the home screen and while following). The line at the top is
       a real line of the page (buildPreview in app.js), so every choice shows on it at once. -->
  <div id="menu" class="menu" hidden>
    <div class="menu-card" role="dialog" aria-label="Display options">
      <i class="grabber" aria-hidden="true"></i>
      <div id="fonts" class="fonts" role="radiogroup" aria-label="Arabic script"></div>

      <label class="size">
        <span class="size-a" lang="ar" aria-hidden="true">ع</span>
        <input id="opt-size" type="range" min="0.8" max="1.6" step="0.1" value="1" aria-label="Text size">
        <span class="size-a big" lang="ar" aria-hidden="true">ع</span>
      </label>

      <div id="preview" class="preview" aria-hidden="true"></div>

      <div class="cards" role="radiogroup" aria-label="Display">
        <button id="mode-page" class="card" role="radio" aria-checked="true">
          <svg viewBox="0 0 64 40" aria-hidden="true"><rect class="frame" x="14" y="1" width="36" height="38" rx="5"/><path class="dim" d="M44 9H22M44 15H26"/><path class="on" d="M44 22H19"/><path class="dim" d="M44 29H24"/></svg>
          Page
        </button>
        <button id="mode-majlis" class="card" role="radio" aria-checked="false">
          <svg viewBox="0 0 64 40" aria-hidden="true"><rect class="frame" x="2" y="4" width="60" height="32" rx="3"/><path class="dim" d="M24 12H40"/><path class="on big" d="M14 20H50"/><path class="dim" d="M22 28H42"/></svg>
          Majlis
        </button>
      </div>
      <div class="cards" role="radiogroup" aria-label="Highlight">
        <button id="unit-phrase" class="card" role="radio" aria-checked="true">
          <svg viewBox="0 0 64 40" aria-hidden="true"><rect class="w-dim" x="14" y="6" width="44" height="4" rx="2"/><rect class="w-ink" x="46" y="18" width="12" height="5" rx="2.5"/><rect class="w-ink" x="34" y="18" width="9" height="5" rx="2.5"/><rect class="wash" x="18" y="13" width="14" height="15" rx="3"/><rect class="w-ink" x="20" y="18" width="10" height="5" rx="2.5"/><rect class="w-dim" x="6" y="18" width="10" height="5" rx="2.5"/><rect class="w-dim" x="20" y="31" width="38" height="4" rx="2"/></svg>
          Word by word
        </button>
        <button id="unit-line" class="card" role="radio" aria-checked="false">
          <svg viewBox="0 0 64 40" aria-hidden="true"><rect class="w-dim" x="14" y="6" width="44" height="4" rx="2"/><rect class="w-ink" x="46" y="18" width="12" height="5" rx="2.5"/><rect class="w-ink" x="34" y="18" width="9" height="5" rx="2.5"/><rect class="w-ink" x="20" y="18" width="11" height="5" rx="2.5"/><rect class="w-ink" x="6" y="18" width="11" height="5" rx="2.5"/><rect class="w-dim" x="20" y="31" width="38" height="4" rx="2"/></svg>
          Line by line
        </button>
      </div>

      <div class="switches">
        <label class="switch">Transliteration<input type="checkbox" role="switch" id="opt-tl" checked></label>
        <label class="switch">Translation<input type="checkbox" role="switch" id="opt-en" checked></label>
        <label class="switch">Only the line being recited<input type="checkbox" role="switch" id="opt-focus"></label>
        <label class="switch opt-hide">Hide the text until it's heard<input type="checkbox" role="switch" id="opt-hide"></label>
      </div>
      <button id="share" class="menu-row" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Show on other screens
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <p id="footnote" class="about"></p>
    </div>
  </div>

  <div id="share-card" class="picker" hidden>
    <div class="picker-card share-card">
      <p class="share-title">Follow along on another screen</p>
      <div id="qr" class="qr" aria-hidden="true"></div>
      <p class="share-code" id="share-code"></p>
      <button id="share-copy" class="chip"></button>
      <p id="share-viewers" class="share-sub"></p>
    </div>
  </div>

  <button id="back" class="chip back" hidden>Back to reciter</button>
  <!-- Practice, text hidden: one more word each tap, logged as a hint (hintWord in app.js). -->
  <button id="hint-btn" class="chip hint-btn">Next word</button>
  <!-- Practice, once stopped: the text stays with what was checked (showReview in app.js). -->
  <div id="review" class="review" hidden>
    <p id="review-sum" class="review-sum"></p>
    <div id="review-left" class="review-left"></div>
    <p id="review-note" class="review-note"></p>
    <div class="review-actions">
      <button id="review-done" class="chip">Done</button>
      <button id="review-again" class="chip review-again">Practise again</button>
    </div>
  </div>
  <p id="toast" class="toast" role="status" hidden></p>

  <audio id="player" hidden></audio>
  <footer id="debug" class="debug" hidden><span id="heard" dir="rtl" lang="ar"></span><span id="latency"></span></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
