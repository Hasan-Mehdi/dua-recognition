[project]
name = "dua-recognition"
version = "0.2.0"
description = "Identify which du'a is being recited and follow it line by line, in real time."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "numpy>=1.24",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
eval = ["jiwer>=3.0"]
train = ["torch>=2.2", "transformers>=4.46", "accelerate", "jiwer>=3.0"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
