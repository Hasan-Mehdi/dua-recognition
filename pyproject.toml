[project]
name = "dua-recognition"
version = "0.1.0"
description = "Recognize which du'a is being recited and where in it, in real time."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "rapidfuzz>=3.0",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]

[project.optional-dependencies]
data = ["yt-dlp", "librosa"]
train = ["transformers>=4.40", "peft>=0.10", "datasets", "accelerate"]
demo = ["streamlit"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
